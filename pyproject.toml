[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-ninjos-backpacks"
version = "1.0.94"
description = "High-fidelity SQLite/MySQL-backed backpacks plugin utilizing endstone-inventoryui"
authors = [
    { name = "Ninjo" }
]
dependencies = [
    "endstone>=0.11.15,<0.12",
    "PyMySQL>=1.1,<2",
    "endstone-inventoryui @ https://github.com/TheNINJALLO/endstone-inventoryui/releases/download/v2.0.10/endstone_inventoryui-2.0.10-py3-none-any.whl"
]
requires-python = ">=3.11"

[project.entry-points."endstone"]
ninjos_backpacks = "ninjos_backpacks.plugin:NinjOSBackpacks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ninjos_backpacks = [
    "config.toml"
]

[tool.endstone]
name = "NinjosBackpacks"
version = "1.0.94"
api = "0.11"
description = "High-fidelity SQLite/MySQL-backed backpacks plugin utilizing endstone-inventoryui"
authors = ["Ninjo"]
prefix = "NinjosBackpacks"
load = "POSTWORLD"
depend = ["inventoryui"]
soft_depend = ["blockdata_api"]
